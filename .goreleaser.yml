version: 2

builds:
  - id: "normal-build"
    env:
      - CGO_ENABLED=0

    mod_timestamp: "{{ .CommitTimestamp }}"

    flags:
      - -trimpath

    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"

    goos:
      - openbsd
      - windows
      - linux

    goarch:
      - amd64
      - "386"
      - arm
      - arm64

    ignore:
      - goos: darwin
        goarch: "386"

      - goos: windows
        goarch: arm

      - goos: openbsd
        goarch: arm

    binary: "{{ .ProjectName }}_v{{ .Version }}"

  # Darwin build (CGO enabled, fsnotify tag)
  - id: "darwin-build"
    env:
      - CGO_ENABLED=1
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    tags:
      - fsnotify
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats:
      - zip
    files:
      - examples/**/*
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
changelog:
  disable: true